<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ES Community Knowledge Infrastructure &mdash; Demonstration</title>
    <script>
      // Applied before first paint so there is no flash of the wrong theme.
      // Reads the same localStorage key ThemeContext.jsx uses; no cookies involved.
      try {
        if (window.localStorage.getItem('cki-demo-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
